<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<body>

<!-- Public Top Header Navbar (used on Landing & Login) -->
<nav th:fragment="public-navbar" class="navbar navbar-expand-lg navbar-dark bg-slate py-3 shadow-sm" style="background-color: #0f172a !important;">
    <div class="container">
        <a class="navbar-brand brand-font d-flex align-items-center gap-2" href="/">
            <div class="bg-primary text-white rounded-3 d-flex align-items-center justify-content-center" style="width: 36px; height: 36px;">
                <i class="fas fa-heart-pulse"></i>
            </div>
            <span class="fs-4 text-white">Rapid<span class="text-primary">Aid</span></span>
        </a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#publicNav">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="publicNav">
            <ul class="navbar-nav me-auto mb-2 mb-lg-0 ms-lg-4">
                <li class="nav-item"><a class="nav-link text-light" href="/#how-it-works">How It Works</a></li>
                <li class="nav-item"><a class="nav-link text-light" href="/#live-stats">Live Metrics</a></li>
            </ul>
            <div class="d-flex gap-2">
                <a sec:authorize="isAnonymous()" href="/login" class="btn btn-outline-light px-4 rounded-pill font-weight-bold">
                    <i class="fas fa-user-shield me-2"></i>Staff Login
                </a>
                <a sec:authorize="isAuthenticated()" href="/dashboard" class="btn btn-primary px-4 rounded-pill font-weight-bold">
                    <i class="fas fa-chart-pie me-2"></i>Go to Dashboard
                </a>
            </div>
        </div>
    </div>
</nav>

<!-- Protected Top Navbar Header -->
<div th:fragment="protected-header(title)" class="top-navbar">
    <div>
        <h4 class="mb-0 text-dark brand-font" th:text="${title}">Dashboard</h4>
        <small class="text-muted">Smart Emergency Ambulance Coordination System</small>
    </div>
    <div class="d-flex align-items-center gap-3">
        <a href="/requests/new" class="btn btn-emergency">
            <i class="fas fa-plus me-2"></i>New Emergency Request
        </a>
        <div class="dropdown">
            <button class="btn btn-light border dropdown-toggle d-flex align-items-center gap-2 rounded-pill px-3 py-2" type="button" data-bs-toggle="dropdown">
                <div class="bg-primary text-white rounded-circle d-flex align-items-center justify-content-center" style="width: 28px; height: 28px; font-size: 0.8rem;">
                    <i class="fas fa-user-md"></i>
                </div>
                <span sec:authentication="name" class="fw-bold small text-dark">User</span>
            </button>
            <ul class="dropdown-menu dropdown-menu-end shadow border-0 mt-2">
                <li><a class="dropdown-item py-2" href="/dashboard"><i class="fas fa-chart-pie me-2 text-primary"></i>Dashboard</a></li>
                <li><a class="dropdown-item py-2" href="/admin/log"><i class="fas fa-clock-rotate-left me-2 text-info"></i>Audit Log</a></li>
                <li><hr class="dropdown-divider"></li>
                <li>
                    <form th:action="@{/logout}" method="post" class="px-2">
                        <button type="submit" class="dropdown-item py-2 text-danger fw-semibold"><i class="fas fa-right-from-bracket me-2"></i>Logout</button>
                    </form>
                </li>
            </ul>
        </div>
    </div>
</div>

</body>
</html>

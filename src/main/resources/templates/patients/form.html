<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${patient.id == null ? 'Add New Patient' : 'Edit Patient'} + ' — RapidAid'">Patient Form</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- FontAwesome 6 -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <!-- Custom Style -->
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

<div class="app-wrapper">
    <div th:replace="~{fragments/sidebar :: sidebar('patients')}"></div>

    <div class="d-flex flex-column flex-grow-1 overflow-hidden">
        <div th:replace="~{fragments/navbar :: protected-header(${patient.id == null ? 'Register New Patient' : 'Edit Patient Details'})}"></div>

        <main class="main-content">
            <div class="row justify-content-center">
                <div class="col-lg-8">
                    <div class="card form-card border-0 shadow-sm">
                        <div class="d-flex align-items-center justify-content-between mb-4 pb-3 border-bottom">
                            <h4 class="brand-font fw-bold mb-0 text-dark">
                                <i class="fas fa-procedures text-teal me-2"></i>
                                <span th:text="${patient.id == null ? 'New Patient Registration' : 'Edit Patient #' + patient.id}">Patient Form</span>
                            </h4>
                            <a href="/patients" class="btn btn-outline-secondary btn-sm"><i class="fas fa-arrow-left me-1"></i>Back to Patients</a>
                        </div>

                        <form th:action="@{/patients}" th:object="${patient}" method="post">
                            <input type="hidden" th:field="*{id}" />

                            <div class="row g-3">
                                <!-- Full Name -->
                                <div class="col-md-6 mb-3">
                                    <label th:for="name" class="form-label fw-semibold">Patient Full Name <span class="text-danger">*</span></label>
                                    <input type="text" th:field="*{name}" class="form-control" th:classappend="${#fields.hasErrors('name')} ? 'is-invalid'" placeholder="e.g. John Doe" required>
                                    <div class="invalid-feedback" th:if="${#fields.hasErrors('name')}" th:errors="*{name}">Name error</div>
                                </div>

                                <!-- Age -->
                                <div class="col-md-3 mb-3">
                                    <label th:for="age" class="form-label fw-semibold">Age (Years) <span class="text-danger">*</span></label>
                                    <input type="number" th:field="*{age}" class="form-control" th:classappend="${#fields.hasErrors('age')} ? 'is-invalid'" placeholder="e.g. 35" min="0" max="120" required>
                                    <div class="invalid-feedback" th:if="${#fields.hasErrors('age')}" th:errors="*{age}">Age error</div>
                                </div>

                                <!-- Gender -->
                                <div class="col-md-3 mb-3">
                                    <label th:for="gender" class="form-label fw-semibold">Gender <span class="text-danger">*</span></label>
                                    <select th:field="*{gender}" class="form-select" th:classappend="${#fields.hasErrors('gender')} ? 'is-invalid'" required>
                                        <option value="">Select Gender</option>
                                        <option th:each="g : ${genders}" th:value="${g}" th:text="${g.displayName}">Male</option>
                                    </select>
                                    <div class="invalid-feedback" th:if="${#fields.hasErrors('gender')}" th:errors="*{gender}">Gender error</div>
                                </div>

                                <!-- Blood Group -->
                                <div class="col-md-6 mb-3">
                                    <label th:for="bloodGroup" class="form-label fw-semibold">Blood Group <span class="text-danger">*</span></label>
                                    <select th:field="*{bloodGroup}" class="form-select" th:classappend="${#fields.hasErrors('bloodGroup')} ? 'is-invalid'" required>
                                        <option value="">Select Blood Group</option>
                                        <option th:each="bg : ${bloodGroups}" th:value="${bg}" th:text="${bg.label}">O+</option>
                                    </select>
                                    <div class="invalid-feedback" th:if="${#fields.hasErrors('bloodGroup')}" th:errors="*{bloodGroup}">Blood Group error</div>
                                </div>

                                <!-- Phone -->
                                <div class="col-md-6 mb-3">
                                    <label th:for="phone" class="form-label fw-semibold">Contact Phone Number <span class="text-danger">*</span></label>
                                    <input type="text" th:field="*{phone}" class="form-control" th:classappend="${#fields.hasErrors('phone')} ? 'is-invalid'" placeholder="e.g. +1-555-0192" required>
                                    <div class="invalid-feedback" th:if="${#fields.hasErrors('phone')}" th:errors="*{phone}">Phone error</div>
                                </div>

                                <!-- Address -->
                                <div class="col-12 mb-3">
                                    <label th:for="address" class="form-label fw-semibold">Residential / Pickup Address <span class="text-danger">*</span></label>
                                    <input type="text" th:field="*{address}" class="form-control" th:classappend="${#fields.hasErrors('address')} ? 'is-invalid'" placeholder="Street address, city, sector..." required>
                                    <div class="invalid-feedback" th:if="${#fields.hasErrors('address')}" th:errors="*{address}">Address error</div>
                                </div>

                                <!-- Medical History -->
                                <div class="col-12 mb-4">
                                    <label th:for="medicalHistory" class="form-label fw-semibold">Medical History &amp; Allergies</label>
                                    <textarea th:field="*{medicalHistory}" class="form-control" rows="3" placeholder="Notes on chronic conditions, allergies, ongoing medications..."></textarea>
                                </div>
                            </div>

                            <div class="d-flex justify-content-end gap-2 border-top pt-3">
                                <a href="/patients" class="btn btn-light px-4">Cancel</a>
                                <button type="submit" class="btn btn-primary-teal px-4">
                                    <i class="fas fa-save me-2"></i>Save Patient Record
                                </button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </main>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/main.js}"></script>
</body>
</html>

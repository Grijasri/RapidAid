<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Patient Management — RapidAid</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- FontAwesome 6 -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <!-- Custom Style -->
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

<div class="app-wrapper">

    <!-- Sidebar Fragment -->
    <div th:replace="~{fragments/sidebar :: sidebar('patients')}"></div>

    <!-- Main Content Area -->
    <div class="d-flex flex-column flex-grow-1 overflow-hidden">
        <div th:replace="~{fragments/navbar :: protected-header('Patient Management')}"></div>

        <main class="main-content">
            <div th:replace="~{fragments/alerts :: alerts}"></div>

            <!-- Header Action & Search Bar -->
            <div class="card border-0 shadow-sm rounded-4 mb-4 p-4">
                <div class="row g-3 align-items-center justify-content-between">
                    <div class="col-md-6 col-lg-5">
                        <form th:action="@{/patients}" method="get" class="d-flex gap-2">
                            <div class="input-group">
                                <span class="input-group-text bg-light text-muted"><i class="fas fa-search"></i></span>
                                <input type="text" name="query" th:value="${query}" class="form-control" placeholder="Search patient name or phone...">
                            </div>
                            <button type="submit" class="btn btn-primary-teal"><i class="fas fa-filter me-1"></i>Search</button>
                            <a th:if="${query != null and !query.isEmpty()}" href="/patients" class="btn btn-outline-secondary"><i class="fas fa-xmark"></i></a>
                        </form>
                    </div>
                    <div class="col-md-auto text-end">
                        <a href="/patients/new" class="btn btn-emergency">
                            <i class="fas fa-user-plus me-2"></i>Add New Patient
                        </a>
                    </div>
                </div>
            </div>

            <!-- Patient Data Table -->
            <div class="card table-custom border-0 shadow-sm mb-4">
                <div class="table-responsive">
                    <table class="table table-hover align-middle mb-0">
                        <thead>
                            <tr>
                                <th>ID</th>
                                <th>PATIENT NAME</th>
                                <th>AGE / GENDER</th>
                                <th>BLOOD GROUP</th>
                                <th>CONTACT PHONE</th>
                                <th>ADDRESS</th>
                                <th class="text-end">ACTIONS</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="patient : ${patients}">
                                <td class="fw-bold text-secondary" th:text="'#' + ${patient.id}">#1</td>
                                <td>
                                    <a th:href="@{/patients/view/{id}(id=${patient.id})}" class="fw-bold text-dark text-decoration-none hover-primary">
                                        <i class="fas fa-user-circle text-teal me-2 fs-5"></i>
                                        <span th:text="${patient.name}">John Doe</span>
                                    </a>
                                </td>
                                <td>
                                    <span th:text="${patient.age} + ' yrs'">30 yrs</span> • 
                                    <span class="text-muted" th:text="${patient.gender.displayName}">Male</span>
                                </td>
                                <td>
                                    <span class="badge bg-danger rounded-pill px-3 py-1" th:text="${patient.bloodGroup.label}">O+</span>
                                </td>
                                <td>
                                    <i class="fas fa-phone text-muted me-1 small"></i>
                                    <span th:text="${patient.phone}">+1-555-0192</span>
                                </td>
                                <td>
                                    <small class="text-muted text-truncate d-inline-block" style="max-width: 220px;" th:text="${patient.address}">123 Main St</small>
                                </td>
                                <td class="text-end">
                                    <div class="btn-group">
                                        <a th:href="@{/patients/view/{id}(id=${patient.id})}" class="btn btn-sm btn-outline-info" title="View History">
                                            <i class="fas fa-eye"></i>
                                        </a>
                                        <a th:href="@{/patients/edit/{id}(id=${patient.id})}" class="btn btn-sm btn-outline-primary" title="Edit Patient">
                                            <i class="fas fa-edit"></i>
                                        </a>
                                        <form th:action="@{/patients/delete/{id}(id=${patient.id})}" method="post" class="d-inline">
                                            <button type="submit" class="btn btn-sm btn-outline-danger btn-delete-confirm" 
                                                    th:data-confirm-message="'Are you sure you want to delete patient record: ' + ${patient.name} + '?'" 
                                                    title="Delete Patient">
                                                <i class="fas fa-trash-can"></i>
                                            </button>
                                        </form>
                                    </div>
                                </td>
                            </tr>
                            <tr th:if="${#lists.isEmpty(patients)}">
                                <td colspan="7" class="text-center py-5">
                                    <div class="empty-state">
                                        <i class="fas fa-user-slash empty-icon"></i>
                                        <h5 class="fw-bold text-dark">No Patients Found</h5>
                                        <p class="text-muted small">No patient records match your filter criteria.</p>
                                        <a href="/patients/new" class="btn btn-primary-teal btn-sm"><i class="fas fa-plus me-1"></i>Register First Patient</a>
                                    </div>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>

                <!-- Pagination Footer -->
                <div th:if="${totalPages > 1}" class="card-footer bg-white py-3 border-0 d-flex justify-content-between align-items-center">
                    <span class="text-muted small" th:text="'Page ' + (${currentPage} + 1) + ' of ' + ${totalPages}">Page 1 of 1</span>
                    <ul class="pagination pagination-sm mb-0">
                        <li class="page-item" th:classappend="${currentPage == 0} ? 'disabled'">
                            <a class="page-item link" th:href="@{/patients(page=${currentPage - 1}, query=${query})}">Previous</a>
                        </li>
                        <li class="page-item" th:each="i : ${#numbers.sequence(0, totalPages - 1)}" th:classappend="${i == currentPage} ? 'active'">
                            <a class="page-link" th:href="@{/patients(page=${i}, query=${query})}" th:text="${i + 1}">1</a>
                        </li>
                        <li class="page-item" th:classappend="${currentPage + 1 == totalPages} ? 'disabled'">
                            <a class="page-link" th:href="@{/patients(page=${currentPage + 1}, query=${query})}">Next</a>
                        </li>
                    </ul>
                </div>
            </div>
        </main>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/main.js}"></script>
</body>
</html>

<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hospital Partner Inquiries — RapidAid</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- FontAwesome 6 -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <!-- Custom Style -->
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

<div class="app-wrapper">
    <div th:replace="~{fragments/sidebar :: sidebar('inquiries')}"></div>

    <div class="d-flex flex-column flex-grow-1 overflow-hidden">
        <div th:replace="~{fragments/navbar :: protected-header('Hospital & Network Partner Inquiries')}"></div>

        <main class="main-content">
            <div class="card table-custom border-0 shadow-sm">
                <div class="card-header bg-white py-3 px-4 d-flex align-items-center justify-content-between">
                    <div>
                        <h6 class="brand-font mb-0 text-dark fw-bold"><i class="fas fa-handshake text-primary me-2"></i>Partner Interest Submissions</h6>
                        <small class="text-muted">Inquiries submitted via public marketing portal</small>
                    </div>
                </div>
                <div class="table-responsive">
                    <table class="table table-hover align-middle mb-0">
                        <thead>
                            <tr>
                                <th>ID</th>
                                <th>CONTACT NAME</th>
                                <th>HOSPITAL / ORGANIZATION</th>
                                <th>EMAIL</th>
                                <th>MESSAGE</th>
                                <th>SUBMITTED AT</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="inq : ${inquiries}">
                                <td>
                                    <span class="fw-bold text-dark" th:text="'#' + ${inq.id}">#1</span>
                                </td>
                                <td>
                                    <span class="fw-bold text-dark" th:text="${inq.name}">Name</span>
                                </td>
                                <td>
                                    <span class="badge bg-light text-dark border px-2 py-1"><i class="fas fa-hospital text-info me-1"></i><span th:text="${inq.hospitalName}">Hospital</span></span>
                                </td>
                                <td>
                                    <a th:href="'mailto:' + ${inq.email}" class="text-primary text-decoration-none fw-semibold" th:text="${inq.email}">email</a>
                                </td>
                                <td>
                                    <div class="small text-truncate" style="max-width: 320px;" th:text="${inq.message}" th:title="${inq.message}">Message</div>
                                </td>
                                <td>
                                    <span class="text-muted small" th:text="${#temporals.format(inq.submittedAt, 'yyyy-MM-dd HH:mm:ss')}">Timestamp</span>
                                </td>
                            </tr>
                            <tr th:if="${#lists.isEmpty(inquiries)}">
                                <td colspan="6" class="empty-state">
                                    <i class="fas fa-inbox empty-icon"></i>
                                    <h6 class="text-dark fw-bold">No Partner Inquiries Yet</h6>
                                    <p class="text-muted small">Submissions from the public landing page partner form will appear here.</p>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </main>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/main.js}"></script>
</body>
</html>

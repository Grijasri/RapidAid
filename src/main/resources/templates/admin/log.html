<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Activity Audit Log — RapidAid</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- FontAwesome 6 -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <!-- Custom Style -->
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

<div class="app-wrapper">
    <div th:replace="~{fragments/sidebar :: sidebar('log')}"></div>

    <div class="d-flex flex-column flex-grow-1 overflow-hidden">
        <div th:replace="~{fragments/navbar :: protected-header('System Activity & Audit Log')}"></div>

        <main class="main-content">
            <div th:replace="~{fragments/alerts :: alerts}"></div>

            <!-- Header Description -->
            <div class="card border-0 shadow-sm rounded-4 mb-4 p-4">
                <div class="d-flex align-items-center justify-content-between">
                    <div>
                        <h5 class="brand-font fw-bold mb-1 text-dark">
                            <i class="fas fa-history text-info me-2"></i>Audit Trail Register
                        </h5>
                        <p class="text-muted small mb-0">System-wide audit trail recording all patient additions, ambulance status toggles, emergency dispatches, and hospital updates.</p>
                    </div>
                    <span class="badge bg-dark px-3 py-2" th:text="${#lists.size(logs)} + ' Total Audit Records'">0 Records</span>
                </div>
            </div>

            <!-- Audit Log Table -->
            <div class="card table-custom border-0 shadow-sm mb-4">
                <div class="table-responsive">
                    <table class="table table-hover align-middle mb-0">
                        <thead>
                            <tr>
                                <th>LOG ID</th>
                                <th>TIMESTAMP</th>
                                <th>ACTION EVENT</th>
                                <th>AUDIT DETAILS</th>
                                <th>PERFORMED BY</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="log : ${logs}">
                                <td class="fw-bold text-secondary" th:text="'#' + ${log.id}">#1</td>
                                <td>
                                    <small class="text-muted fw-medium" th:text="${#temporals.format(log.timestamp, 'yyyy-MM-dd HH:mm:ss')}">Timestamp</small>
                                </td>
                                <td>
                                    <span class="badge rounded-pill bg-light text-dark border px-3 py-1 font-monospace" th:text="${log.action}">ACTION_NAME</span>
                                </td>
                                <td class="text-dark" th:text="${log.details}">Details of action taken</td>
                                <td>
                                    <span class="badge bg-secondary rounded-pill px-2 py-1">
                                        <i class="fas fa-user-shield me-1"></i>
                                        <span th:text="${log.performedBy}">admin</span>
                                    </span>
                                </td>
                            </tr>
                            <tr th:if="${#lists.isEmpty(logs)}">
                                <td colspan="5" class="text-center py-5 text-muted">
                                    <i class="fas fa-folder-open fs-3 d-block mb-2 text-secondary"></i>
                                    No activity logs recorded.
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </main>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/main.js}"></script>
</body>
</html>

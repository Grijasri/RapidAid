<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${hospital.id == null ? 'Add Hospital' : 'Edit Hospital'} + ' — RapidAid'">Hospital Form</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- FontAwesome 6 -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <!-- Custom Style -->
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

<div class="app-wrapper">
    <div th:replace="~{fragments/sidebar :: sidebar('hospitals')}"></div>

    <div class="d-flex flex-column flex-grow-1 overflow-hidden">
        <div th:replace="~{fragments/navbar :: protected-header(${hospital.id == null ? 'Register New Hospital' : 'Edit Hospital Details'})}"></div>

        <main class="main-content">
            <div class="row justify-content-center">
                <div class="col-lg-8">
                    <div class="card form-card border-0 shadow-sm">
                        <div class="d-flex align-items-center justify-content-between mb-4 pb-3 border-bottom">
                            <h4 class="brand-font fw-bold mb-0 text-dark">
                                <i class="fas fa-hospital text-info me-2"></i>
                                <span th:text="${hospital.id == null ? 'New Hospital Facility' : 'Edit Facility: ' + hospital.name}">Hospital Form</span>
                            </h4>
                            <a href="/hospitals" class="btn btn-outline-secondary btn-sm"><i class="fas fa-arrow-left me-1"></i>Back to Hospitals</a>
                        </div>

                        <form th:action="@{/hospitals}" th:object="${hospital}" method="post">
                            <input type="hidden" th:field="*{id}" />

                            <div class="row g-3">
                                <!-- Hospital Name -->
                                <div class="col-md-6 mb-3">
                                    <label th:for="name" class="form-label fw-semibold">Hospital Name <span class="text-danger">*</span></label>
                                    <input type="text" th:field="*{name}" class="form-control" th:classappend="${#fields.hasErrors('name')} ? 'is-invalid'" placeholder="e.g. St. Jude Medical Center" required>
                                    <div class="invalid-feedback" th:if="${#fields.hasErrors('name')}" th:errors="*{name}">Hospital name error</div>
                                </div>

                                <!-- Contact Phone -->
                                <div class="col-md-6 mb-3">
                                    <label th:for="contactPhone" class="form-label fw-semibold">Emergency Desk Phone <span class="text-danger">*</span></label>
                                    <input type="text" th:field="*{contactPhone}" class="form-control" th:classappend="${#fields.hasErrors('contactPhone')} ? 'is-invalid'" placeholder="e.g. +1-555-8000" required>
                                    <div class="invalid-feedback" th:if="${#fields.hasErrors('contactPhone')}" th:errors="*{contactPhone}">Phone error</div>
                                </div>

                                <!-- Total Beds -->
                                <div class="col-md-6 mb-3">
                                    <label th:for="totalBeds" class="form-label fw-semibold">Total ICU / Emergency Beds <span class="text-danger">*</span></label>
                                    <input type="number" th:field="*{totalBeds}" class="form-control" th:classappend="${#fields.hasErrors('totalBeds')} ? 'is-invalid'" placeholder="e.g. 150" min="1" required>
                                    <div class="invalid-feedback" th:if="${#fields.hasErrors('totalBeds')}" th:errors="*{totalBeds}">Total beds error</div>
                                </div>

                                <!-- Available Beds -->
                                <div class="col-md-6 mb-3">
                                    <label th:for="availableBeds" class="form-label fw-semibold">Currently Available Beds <span class="text-danger">*</span></label>
                                    <input type="number" th:field="*{availableBeds}" class="form-control" th:classappend="${#fields.hasErrors('availableBeds')} ? 'is-invalid'" placeholder="e.g. 42" min="0" required>
                                    <div class="invalid-feedback" th:if="${#fields.hasErrors('availableBeds')}" th:errors="*{availableBeds}">Available beds error</div>
                                </div>

                                <!-- Address -->
                                <div class="col-12 mb-4">
                                    <label th:for="address" class="form-label fw-semibold">Hospital Full Address <span class="text-danger">*</span></label>
                                    <input type="text" th:field="*{address}" class="form-control" th:classappend="${#fields.hasErrors('address')} ? 'is-invalid'" placeholder="Street address, precinct, city..." required>
                                    <div class="invalid-feedback" th:if="${#fields.hasErrors('address')}" th:errors="*{address}">Address error</div>
                                </div>
                            </div>

                            <div class="d-flex justify-content-end gap-2 border-top pt-3">
                                <a href="/hospitals" class="btn btn-light px-4">Cancel</a>
                                <button type="submit" class="btn btn-primary-teal px-4">
                                    <i class="fas fa-save me-2"></i>Save Hospital
                                </button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </main>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/main.js}"></script>
</body>
</html>

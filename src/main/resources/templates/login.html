<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Staff Login — RapidAid</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- FontAwesome 6 -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <!-- Custom Style -->
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body class="bg-light d-flex flex-column min-vh-100">

    <!-- Top Navbar -->
    <div th:replace="~{fragments/navbar :: public-navbar}"></div>

    <div class="container my-auto py-5">
        <div class="row justify-content-center">
            <div class="col-md-6 col-lg-5">

                <!-- Login Card -->
                <div class="card form-card border-0 shadow-lg">
                    <div class="text-center mb-4">
                        <div class="bg-danger text-white rounded-circle d-inline-flex align-items-center justify-content-center mb-3 shadow" style="width: 56px; height: 56px;">
                            <i class="fas fa-user-shield fs-3"></i>
                        </div>
                        <h3 class="brand-font fw-bold text-dark">Staff Portal Login</h3>
                        <p class="text-muted small">Sign in to access the emergency coordination dashboard</p>
                    </div>

                    <!-- Alerts -->
                    <div th:replace="~{fragments/alerts :: alerts}"></div>

                    <form th:action="@{/login}" method="post">
                        <div class="mb-3">
                            <label for="username" class="form-label fw-semibold text-secondary">Username</label>
                            <div class="input-group">
                                <span class="input-group-text bg-light text-muted"><i class="fas fa-user"></i></span>
                                <input type="text" id="username" name="username" class="form-control" placeholder="Enter your username" required autofocus>
                            </div>
                        </div>

                        <div class="mb-4">
                            <label for="password" class="form-label fw-semibold text-secondary">Password</label>
                            <div class="input-group">
                                <span class="input-group-text bg-light text-muted"><i class="fas fa-lock"></i></span>
                                <input type="password" id="password" name="password" class="form-control" placeholder="Enter your password" required>
                            </div>
                        </div>

                        <div class="d-grid mb-3">
                            <button type="submit" class="btn btn-emergency btn-lg fs-6 py-2">
                                <i class="fas fa-right-to-bracket me-2"></i>Sign In
                            </button>
                        </div>
                    </form>

                    <!-- Default Admin Demo Notice -->
                    <div class="alert alert-info border-0 bg-light-info text-dark p-3 mt-3 rounded-3 small">
                        <div class="fw-bold mb-1"><i class="fas fa-key text-info me-2"></i>Demo Admin Credentials:</div>
                        <div class="d-flex justify-content-between">
                            <span>Username: <strong>admin</strong></span>
                            <span>Password: <strong>admin123</strong></span>
                        </div>
                    </div>
                </div>

                <div class="text-center mt-3">
                    <a href="/" class="text-decoration-none text-muted small"><i class="fas fa-arrow-left me-1"></i>Back to RapidAid Home</a>
                </div>

            </div>
        </div>
    </div>

    <!-- Footer -->
    <div th:replace="~{fragments/footer :: footer}"></div>

    <!-- Bootstrap JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script th:src="@{/js/main.js}"></script>
</body>
</html>

<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${ambulance.id == null ? 'Add Ambulance' : 'Edit Ambulance'} + ' — RapidAid'">Ambulance Form</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- FontAwesome 6 -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <!-- Custom Style -->
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

<div class="app-wrapper">
    <div th:replace="~{fragments/sidebar :: sidebar('ambulances')}"></div>

    <div class="d-flex flex-column flex-grow-1 overflow-hidden">
        <div th:replace="~{fragments/navbar :: protected-header(${ambulance.id == null ? 'Register New Ambulance' : 'Edit Ambulance Details'})}"></div>

        <main class="main-content">
            <div class="row justify-content-center">
                <div class="col-lg-8">
                    <div class="card form-card border-0 shadow-sm">
                        <div class="d-flex align-items-center justify-content-between mb-4 pb-3 border-bottom">
                            <h4 class="brand-font fw-bold mb-0 text-dark">
                                <i class="fas fa-truck-medical text-danger me-2"></i>
                                <span th:text="${ambulance.id == null ? 'New Vehicle Registration' : 'Edit Vehicle ' + ambulance.vehicleNumber}">Ambulance Form</span>
                            </h4>
                            <a href="/ambulances" class="btn btn-outline-secondary btn-sm"><i class="fas fa-arrow-left me-1"></i>Back to Fleet</a>
                        </div>

                        <form th:action="@{/ambulances}" th:object="${ambulance}" method="post">
                            <input type="hidden" th:field="*{id}" />

                            <div class="row g-3">
                                <!-- Vehicle Number -->
                                <div class="col-md-6 mb-3">
                                    <label th:for="vehicleNumber" class="form-label fw-semibold">Vehicle Plate Number <span class="text-danger">*</span></label>
                                    <input type="text" th:field="*{vehicleNumber}" class="form-control" th:classappend="${#fields.hasErrors('vehicleNumber')} ? 'is-invalid'" placeholder="e.g. AMB-101" required>
                                    <div class="invalid-feedback" th:if="${#fields.hasErrors('vehicleNumber')}" th:errors="*{vehicleNumber}">Vehicle number error</div>
                                </div>

                                <!-- Ambulance Type -->
                                <div class="col-md-6 mb-3">
                                    <label th:for="type" class="form-label fw-semibold">Ambulance Type / Equipment <span class="text-danger">*</span></label>
                                    <select th:field="*{type}" class="form-select" th:classappend="${#fields.hasErrors('type')} ? 'is-invalid'" required>
                                        <option th:each="t : ${types}" th:value="${t}" th:text="${t.displayName}">Basic</option>
                                    </select>
                                    <div class="invalid-feedback" th:if="${#fields.hasErrors('type')}" th:errors="*{type}">Type error</div>
                                </div>

                                <!-- Driver Name -->
                                <div class="col-md-6 mb-3">
                                    <label th:for="driverName" class="form-label fw-semibold">Assigned Driver Name <span class="text-danger">*</span></label>
                                    <input type="text" th:field="*{driverName}" class="form-control" th:classappend="${#fields.hasErrors('driverName')} ? 'is-invalid'" placeholder="e.g. John Miller" required>
                                    <div class="invalid-feedback" th:if="${#fields.hasErrors('driverName')}" th:errors="*{driverName}">Driver name error</div>
                                </div>

                                <!-- Driver Phone -->
                                <div class="col-md-6 mb-3">
                                    <label th:for="driverPhone" class="form-label fw-semibold">Driver Contact Phone <span class="text-danger">*</span></label>
                                    <input type="text" th:field="*{driverPhone}" class="form-control" th:classappend="${#fields.hasErrors('driverPhone')} ? 'is-invalid'" placeholder="e.g. +1-555-9001" required>
                                    <div class="invalid-feedback" th:if="${#fields.hasErrors('driverPhone')}" th:errors="*{driverPhone}">Driver phone error</div>
                                </div>

                                <!-- Base Location -->
                                <div class="col-md-6 mb-3">
                                    <label th:for="baseLocation" class="form-label fw-semibold">Base Location / Station <span class="text-danger">*</span></label>
                                    <input type="text" th:field="*{baseLocation}" class="form-control" th:classappend="${#fields.hasErrors('baseLocation')} ? 'is-invalid'" placeholder="e.g. Station 1, Central Depot" required>
                                    <div class="invalid-feedback" th:if="${#fields.hasErrors('baseLocation')}" th:errors="*{baseLocation}">Base location error</div>
                                </div>

                                <!-- Status -->
                                <div class="col-md-6 mb-3">
                                    <label th:for="status" class="form-label fw-semibold">Initial Status <span class="text-danger">*</span></label>
                                    <select th:field="*{status}" class="form-select" th:classappend="${#fields.hasErrors('status')} ? 'is-invalid'" required>
                                        <option th:each="st : ${statuses}" th:value="${st}" th:text="${st.displayName}">Available</option>
                                    </select>
                                    <div class="invalid-feedback" th:if="${#fields.hasErrors('status')}" th:errors="*{status}">Status error</div>
                                </div>
                            </div>

                            <div class="d-flex justify-content-end gap-2 border-top pt-3">
                                <a href="/ambulances" class="btn btn-light px-4">Cancel</a>
                                <button type="submit" class="btn btn-emergency px-4">
                                    <i class="fas fa-save me-2"></i>Save Vehicle
                                </button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </main>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/main.js}"></script>
</body>
</html>

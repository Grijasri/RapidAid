<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Error — RapidAid</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- FontAwesome 6 -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <!-- Custom Style -->
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body class="bg-light d-flex flex-column min-vh-100">

    <!-- Top Navbar -->
    <div th:replace="~{fragments/navbar :: public-navbar}"></div>

    <div class="container my-auto py-5 text-center">
        <div class="row justify-content-center">
            <div class="col-md-7 col-lg-6">
                <div class="card border-0 shadow-lg rounded-4 p-5">
                    <div class="icon-red mx-auto mb-4" style="width: 80px; height: 80px; border-radius: 50%;">
                        <i class="fas fa-triangle-exclamation fs-1"></i>
                    </div>
                    <h3 class="brand-font fw-bold text-dark mb-2" th:text="${errorTitle != null ? errorTitle : 'Unexpected Application Error'}">System Error</h3>
                    <p class="text-muted mb-4" th:text="${errorMessage != null ? errorMessage : 'The system encountered an error processing your request. Please try again or return to the dashboard.'}">An error occurred.</p>
                    <div class="d-flex justify-content-center gap-3">
                        <a href="/dashboard" class="btn btn-primary-teal btn-lg px-4"><i class="fas fa-columns me-2"></i>Go to Dashboard</a>
                        <a href="/" class="btn btn-outline-secondary btn-lg px-4"><i class="fas fa-home me-2"></i>Public Home</a>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Footer -->
    <div th:replace="~{fragments/footer :: footer}"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script th:src="@{/js/main.js}"></script>
</body>
</html>

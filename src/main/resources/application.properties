# Application Info
spring.application.name=RapidAid
server.port=${PORT:8080}

# ===================================================================
# DATABASE CONFIGURATION
# ===================================================================
# Default configuration uses H2 In-Memory Database for instant zero-config startup.
# To connect to MySQL 8, uncomment the MySQL section below and comment out H2.

# --- H2 Database Setup (Default for zero-config running) ---
spring.datasource.url=jdbc:h2:mem:rapidaid_db;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=MySQL
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# --- MySQL 8 Setup (Uncomment to use local MySQL) ---
# spring.datasource.url=jdbc:mysql://localhost:3306/rapidaid_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
# spring.datasource.driverClassName=com.mysql.cj.jdbc.Driver
# spring.datasource.username=root
# spring.datasource.password=root

# JPA / Hibernate Configuration
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
# For MySQL dialect, use: org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# Database Initialization (runs data.sql on startup)
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always

# Logging Configuration
logging.level.com.rapidaid=INFO
logging.level.org.springframework.security=WARN

# Thymeleaf Configuration
spring.thymeleaf.cache=false
spring.thymeleaf.mode=HTML
spring.thymeleaf.encoding=UTF-8

# ===================================================================
# REAL SMTP MAIL CONFIGURATION (Gmail / Custom SMTP)
# ===================================================================
# To send real emails to patient and hospital inboxes:
# Pass env variables or set spring.mail.username / spring.mail.password below.
# For Gmail: Use 'smtp.gmail.com', port 587, username = your Gmail, password = 16-char App Password
spring.mail.host=${SPRING_MAIL_HOST:${MAIL_HOST:smtp.gmail.com}}
spring.mail.port=${SPRING_MAIL_PORT:${MAIL_PORT:587}}
spring.mail.username=${SPRING_MAIL_USERNAME:${MAIL_USERNAME:}}
spring.mail.password=${SPRING_MAIL_PASSWORD:${MAIL_PASSWORD:}}

# ===================================================================
# TWILIO SMS CONFIGURATION
# ===================================================================
# Set these environment variables in your deployment environment:
# TWILIO_ACCOUNT_SID=ACXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXX
# TWILIO_AUTH_TOKEN=your_auth_token
# TWILIO_PHONE_NUMBER=+1234567890
twilio.account.sid=${TWILIO_ACCOUNT_SID:}
twilio.auth.token=${TWILIO_AUTH_TOKEN:}
twilio.phone.number=${TWILIO_PHONE_NUMBER:${TWILIO_FROM_NUMBER:}}


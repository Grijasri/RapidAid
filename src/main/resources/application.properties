# Application Info
spring.application.name=RapidAid
server.port=${PORT:8080}

# ===================================================================
# DATABASE CONFIGURATION
# ===================================================================
# Default configuration uses H2 In-Memory Database for instant zero-config startup.
# To connect to MySQL 8, uncomment the MySQL section below and comment out H2.

# --- H2 Database Setup (Default for zero-config running) ---
spring.datasource.url=jdbc:h2:mem:rapidaid_db;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=MySQL
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# --- MySQL 8 Setup (Uncomment to use local MySQL) ---
# spring.datasource.url=jdbc:mysql://localhost:3306/rapidaid_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
# spring.datasource.driverClassName=com.mysql.cj.jdbc.Driver
# spring.datasource.username=root
# spring.datasource.password=root

# JPA / Hibernate Configuration
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
# For MySQL dialect, use: org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# Database Initialization (runs data.sql on startup)
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always

# Logging Configuration
logging.level.com.rapidaid=INFO
logging.level.org.springframework.security=WARN

# Thymeleaf Configuration
spring.thymeleaf.cache=false
spring.thymeleaf.mode=HTML
spring.thymeleaf.encoding=UTF-8
